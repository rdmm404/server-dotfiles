# Ordinary files: restic reads these directly. No export/capture hooks.
# The API is rebuilt from Git; PostgreSQL has its own dump-based profile.
finance-recovery:
  inherit: default
  backup:
    source:
      - /home/rdmm404/apps/voltr-finance/.env
      - /home/rdmm404/apps/voltr-finance/.env.dbmate
      - /home/rdmm404/apps/voltr-finance/.secrets
      - /home/rdmm404/apps/voltr-finance/docker-compose.prd.yml
      - /home/rdmm404/apps/voltr-finance/Dockerfile
      - /home/rdmm404/.local/bin/voltr-finance
      - /home/rdmm404/services/agents/voltr-finance-config.json
    tag:
      - finance-recovery
      - core
    no-error-on-warning: false
